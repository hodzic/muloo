<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0f12">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Tuner, metronome, score viewer and practice recorder for guitar and ukulele.">
  <title>MuLoo</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1 id="view-title">MuLoo</h1>
    <div class="topbar-actions">
      <button id="help-btn" class="btn icon" aria-label="How to use the tuner" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17.2v.1"/></svg>
      </button>
      <button id="settings-btn" class="btn icon" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.4 7.4 0 0 0-1.7-1L15 3.4h-4l-.3 2.6a7.4 7.4 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.4 7.4 0 0 0 1.7 1l.3 2.6h4l.3-2.6a7.4 7.4 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-tune" class="view" hidden></section>
    <section id="view-practice" class="view" hidden></section>
    <section id="view-scores" class="view" hidden></section>
    <section id="view-recordings" class="view" hidden></section>
  </main>

  <nav class="tabbar" role="tablist">
    <button role="tab" data-tab="tune">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10M5 21a7 7 0 0 1 14 0M12 13l4-4"/></svg>
      <span>Tune</span>
    </button>
    <button role="tab" data-tab="practice">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8l-3-17h-2zM12 14l5-7"/></svg>
      <span>Practice</span>
    </button>
    <button role="tab" data-tab="scores">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM9 9h7M9 13h7M9 17h4"/></svg>
      <span>Scores</span>
    </button>
    <button role="tab" data-tab="recordings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span>Recordings</span>
    </button>
  </nav>

  <dialog id="settings-dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>MuLoo needs JavaScript.</noscript>
</body>
</html>
