<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mic Static Test</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --text: #111; --muted: #666; --line: #ccc; --on: #d33; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --text: #eee; --muted: #999; --line: #444; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 16px; }
  button { display: block; width: 100%; margin: 0 0 10px; padding: 14px; font: inherit; text-align: left;
    border: 1px solid var(--line); border-radius: 10px; background: transparent; color: inherit; }
  button.on { background: var(--on); border-color: var(--on); color: #fff; }
  button small { display: block; opacity: 0.75; }
  pre { white-space: pre-wrap; font-size: 13px; color: var(--muted); }
  button:disabled { opacity: 0.4; }
  .ask { border: 1px solid var(--on); border-radius: 10px; padding: 12px; margin: 0 0 16px; }
  .ask p { color: inherit; margin: 0 0 10px; }
  .row { display: flex; gap: 8px; }
  .row button { text-align: center; margin: 0; }
  table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 14px; }
  td, th { border-bottom: 1px solid var(--line); padding: 6px 4px; text-align: left; }
</style>
</head>
<body>
<h1>Mic static test</h1>
<p>Play Spotify and tap a test. Listen, then tap it again to stop: the page reloads and asks how it went. Wait until Spotify sounds clean before the next test. Tests 7–11 click like a metronome.</p>
<div id="ask" class="ask" hidden></div>
<table id="results" hidden><thead><tr><th>Test</th><th>Crackle</th><th>Speaker</th></tr></thead><tbody></tbody></table>
<div id="tests"></div>
<button id="clear">Clear results</button>
<pre id="log"></pre>
<script type="module">
const RAW = { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 };
const log = (s) => { document.getElementById('log').textContent = s; };
const describe = (stream, ctx) => {
  const t = stream?.getAudioTracks()[0];
  const s = t?.getSettings() ?? {};
  return [t && `mic: ${t.label}`, t && `settings: ${JSON.stringify(s)}`, ctx && `context: ${ctx.sampleRate} Hz, ${ctx.state}`]
    .filter(Boolean).join('\n');
};

let stopCurrent = null;

// Web Audio playing metronome-like clicks, optionally with a mic connected.
async function clicksWith(audio) {
  const ctx = new AudioContext({ latencyHint: 'interactive' });
  await ctx.resume();
  let stream = null;
  if (audio) {
    stream = await navigator.mediaDevices.getUserMedia({ audio });
    ctx.createMediaStreamSource(stream).connect(ctx.createAnalyser());
  }
  const out = ctx.createGain();
  out.gain.value = 0.3;
  out.connect(ctx.destination);
  let next = ctx.currentTime + 0.1;
  const tick = () => {
    while (next < ctx.currentTime + 0.3) {
      const osc = ctx.createOscillator(), env = ctx.createGain();
      osc.frequency.value = 1500;
      env.gain.setValueAtTime(1, next);
      env.gain.exponentialRampToValueAtTime(0.001, next + 0.05);
      osc.connect(env).connect(out);
      osc.start(next);
      osc.stop(next + 0.06);
      next += 0.5;
    }
  };
  const timer = setInterval(tick, 50);
  tick();
  log(describe(stream, ctx));
  return () => { clearInterval(timer); stream?.getTracks().forEach((t) => t.stop()); ctx.close(); };
}

const tests = [
  {
    name: '1. Mic only, raw', note: 'No audio processing, no Web Audio',
    async start() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: RAW });
      log(describe(stream));
      return () => stream.getTracks().forEach((t) => t.stop());
    },
  },
  {
    name: '2. Mic only, browser defaults', note: 'Echo cancelling etc. on',
    async start() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      log(describe(stream));
      return () => stream.getTracks().forEach((t) => t.stop());
    },
  },
  {
    name: '3. Web Audio only, no mic', note: 'A running, silent AudioContext',
    async start() {
      const ctx = new AudioContext({ latencyHint: 'interactive' });
      await ctx.resume();
      log(describe(null, ctx));
      return () => ctx.close();
    },
  },
  {
    name: '4. Mic raw + Web Audio', note: 'What MuLoo does now',
    async start() {
      const ctx = new AudioContext({ latencyHint: 'interactive' });
      await ctx.resume();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: RAW });
      const an = ctx.createAnalyser();
      ctx.createMediaStreamSource(stream).connect(an);
      log(describe(stream, ctx));
      return () => { stream.getTracks().forEach((t) => t.stop()); ctx.close(); };
    },
  },
  {
    name: '5. Mic raw + Web Audio at mic rate', note: 'AudioContext at the mic’s sample rate',
    async start() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: RAW });
      const rate = stream.getAudioTracks()[0].getSettings().sampleRate;
      const ctx = new AudioContext(rate ? { sampleRate: rate } : {});
      await ctx.resume();
      const an = ctx.createAnalyser();
      ctx.createMediaStreamSource(stream).connect(an);
      log(describe(stream, ctx));
      return () => { stream.getTracks().forEach((t) => t.stop()); ctx.close(); };
    },
  },
  {
    name: '6. Mic raw, read without Web Audio', note: 'MediaStreamTrackProcessor (newer Chrome only)',
    async start() {
      if (typeof MediaStreamTrackProcessor === 'undefined') throw new Error('Not supported in this browser');
      const stream = await navigator.mediaDevices.getUserMedia({ audio: RAW });
      const reader = new MediaStreamTrackProcessor({ track: stream.getAudioTracks()[0] }).readable.getReader();
      let frames = 0, running = true;
      (async () => {
        while (running) {
          const { value, done } = await reader.read();
          if (done) break;
          frames++;
          value.close();
        }
      })();
      const timer = setInterval(() => log(`${describe(stream)}\nframes read: ${frames}`), 500);
      return () => { running = false; clearInterval(timer); reader.cancel().catch(() => {}); stream.getTracks().forEach((t) => t.stop()); };
    },
  },
  {
    name: '7. Clicks only, no mic', note: 'Baseline: Web Audio playing, mic closed',
    start: () => clicksWith(null),
  },
  {
    name: '8. Raw mic + clicks', note: 'Like recording with the metronome now',
    start: () => clicksWith(RAW),
  },
  {
    name: '9. Echo cancellation only + clicks', note: 'Noise suppression and auto gain off',
    start: () => clicksWith({ ...RAW, echoCancellation: true }),
  },
  {
    name: '10. Browser defaults + clicks', note: 'All processing on',
    start: () => clicksWith(true),
  },
  {
    name: '11. Raw mic at 48 kHz + clicks', note: 'Asks for 48 kHz from the mic',
    start: () => clicksWith({ ...RAW, sampleRate: 48000 }),
  },
];

// Results survive the reload after each test (this browser only).
const KEY = 'mic-test-results';
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* private mode */ } };
const results = load(KEY, {});

function renderResults() {
  const rows = tests.map((t) => [t.name, results[t.name]]).filter(([, r]) => r);
  const table = document.getElementById('results');
  table.hidden = !rows.length;
  table.querySelector('tbody').innerHTML = rows.map(([n, r]) =>
    `<tr><td>${n}</td><td>${r.crackle ?? '?'}</td><td>${r.speaker ?? '?'}</td></tr>`).join('');
}

// After a test stops: ask about it.
const last = load(KEY + ':last', null);
if (last) {
  const ask = document.getElementById('ask');
  ask.hidden = false;
  const r = (results[last] ??= {});
  const render = () => {
    ask.innerHTML = `<p><b>${last}</b> stopped. How did Spotify sound?</p>
      <div class="row"><button data-k="crackle" data-v="crackled">Crackled</button><button data-k="crackle" data-v="clean">Clean</button></div>
      <p style="margin-top:10px">Where did Spotify play?</p>
      <div class="row"><button data-k="speaker" data-v="usual">Usual output</button><button data-k="speaker" data-v="phone speaker">Phone speaker</button></div>
      <p style="margin-top:10px">Wait until Spotify sounds clean again before the next test.</p>`;
    ask.querySelectorAll('[data-k]').forEach((b) => {
      b.classList.toggle('on', r[b.dataset.k] === b.dataset.v);
      b.onclick = () => { r[b.dataset.k] = b.dataset.v; save(KEY, results); render(); renderResults(); };
    });
  };
  render();
}
renderResults();

const box = document.getElementById('tests');
for (const t of tests) {
  const b = document.createElement('button');
  b.innerHTML = `${t.name}<small>${t.note}</small>`;
  b.onclick = async () => {
    if (b.classList.contains('on')) {
      // Stop, then reload so the next test starts from a clean page.
      stopCurrent?.();
      save(KEY + ':last', t.name);
      setTimeout(() => location.reload(), 300);
      return;
    }
    document.getElementById('ask').hidden = true;
    document.querySelectorAll('#tests button').forEach((x) => { x.disabled = x !== b; });
    try {
      stopCurrent = await t.start();
      b.classList.add('on');
      b.querySelector('small').textContent = 'Running: tap to stop';
    } catch (e) {
      log(`${t.name}: ${e.name}: ${e.message}`);
      document.querySelectorAll('#tests button').forEach((x) => { x.disabled = false; });
    }
  };
  box.append(b);
}

document.getElementById('clear').onclick = () => {
  try { localStorage.removeItem(KEY); localStorage.removeItem(KEY + ':last'); } catch { /* private mode */ }
  location.reload();
};
</script>
</body>
</html>
